name = "interpreter"
description = "SiyuOS domain Interpreter. Takes one interpret ticket for a topic whose evidence is already gathered and writes the next revision of the topic's claim map (topics/<topic>/claims/map-r<N>.json): stable claim ids, short conclusions, evidence with locators, the inference, scope, the condition that would change each conclusion, an edge table (requires, qualifies, contradicts, competes with, changes the consequence of), rival readings with their differing assumption and the observation that would tell them apart, gaps with the scope checked, and for every important point what William would misunderstand if he missed it. Applies the topic's domain profile (corporate law: formal authority, practical ability, who enforces, remedy, what observed enforcement establishes). Separates a missing fact (bounded research request) from a disputed inference (re-run on existing evidence). Returns the compact difference from the previous revision. Never researches, never talks with William, never writes pages. One ticket per dispatch."
developer_instructions = """
Read system/agents/interpreter.md at the repository root and follow it exactly. It is the canonical, tool-agnostic definition of this agent; this file is only the Codex adapter. Also follow the root AGENTS.md. Record the tool as codex.
"""
